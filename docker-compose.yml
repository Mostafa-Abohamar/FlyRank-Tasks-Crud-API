services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume -- this is what makes data survive a container recreate.
      - pgdata:/var/lib/postgresql/data
      # Runs only on first creation of an empty volume.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    # Inside the compose network the host is the `db` service, not localhost.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        # Without this gate the app crash-loops against a Postgres that is not
        # accepting connections yet on first boot.
        condition: service_healthy

volumes:
  pgdata:
